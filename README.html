<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bring your own keys | Customer guide</title>
  <!--
    Content SSOT: README.md
    This file is a Cortex Docs–styled viewer only. Do not put guide prose here.
  -->
  <style>
    :root {
      --bg: #ffffff;
      --bg-subtle: #f7f7f8;
      --border: #e5e5e6;
      --border-strong: #d4d4d8;
      --text: #1c1c24;
      --text-muted: #696979;
      --heading: #1c1c24;
      --link: #4a44b8;
      --link-hover: #3a35a0;
      --brand: #00a452;
      --brand-bright: #49ffa4;
      --accent: #7c74de;
      --warning-bg: #fff5ec;
      --warning-border: #fe9a00;
      --warning-text: #5c3b14;
      --success-bg: #eefcf2;
      --success-border: #00a452;
      --success-text: #163019;
      --info-bg: #f0f1ff;
      --info-border: #7c74de;
      --info-text: #1c1c24;
      --font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      --mono: "SF Mono", "Menlo", "Consolas", ui-monospace, monospace;
      --radius: 8px;
      --max: 780px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { color: var(--link-hover); text-decoration: underline; }
    .topbar {
      position: sticky; top: 0; z-index: 20;
      background: #fff; border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.25rem; display: flex; align-items: center; gap: 0.75rem;
    }
    .brand {
      display: inline-flex; align-items: center; gap: 0.55rem;
      color: var(--heading); font-weight: 700; font-size: 0.95rem; text-decoration: none;
    }
    .brand:hover { color: var(--heading); text-decoration: none; }
    .brand-mark {
      width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
      background: radial-gradient(circle at 35% 35%, #b8ffe0 0%, var(--brand-bright) 45%, var(--brand) 100%);
      box-shadow: 0 0 0 1px rgba(0, 164, 82, 0.25);
    }
    .topbar-meta { margin-left: auto; color: var(--text-muted); font-size: 0.85rem; }
    .page { max-width: var(--max); margin: 0 auto; padding: 1.5rem 1.25rem 3.5rem; }
    .ssot {
      font-size: 0.85rem; color: var(--text-muted); margin: 0 0 1.25rem;
      padding: 0.55rem 0.75rem; background: var(--bg-subtle);
      border: 1px solid var(--border); border-radius: var(--radius);
    }
    .ssot code { font-size: 0.92em; }
    #content :is(h1, h2, h3) { color: var(--heading); line-height: 1.3; }
    #content h1 {
      margin: 0 0 0.75rem; font-size: clamp(1.75rem, 3vw, 2.15rem);
      letter-spacing: -0.02em; font-weight: 700;
    }
    #content h2 {
      margin: 2rem 0 0.85rem; font-size: 1.35rem; font-weight: 700;
      padding-top: 0.35rem; border-top: 1px solid var(--border);
    }
    #content h2:first-of-type { border-top: none; padding-top: 0; margin-top: 1.25rem; }
    #content h3 { margin: 1.15rem 0 0.45rem; font-size: 1.05rem; font-weight: 650; }
    #content p, #content li { margin: 0.55rem 0; }
    #content ul, #content ol { padding-left: 1.3rem; }
    #content blockquote,
    #content .hint {
      border: 1px solid var(--border); border-left-width: 4px; border-radius: var(--radius);
      padding: 0.85rem 1rem; margin: 1rem 0; background: var(--bg-subtle);
    }
    #content .hint .label {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; margin-bottom: 0.3rem;
    }
    #content .hint.info { background: var(--info-bg); border-left-color: var(--info-border); color: var(--info-text); }
    #content .hint.info .label { color: var(--accent); }
    #content .hint.success { background: var(--success-bg); border-left-color: var(--success-border); color: var(--success-text); }
    #content .hint.success .label { color: var(--brand); }
    #content .hint.warning { background: var(--warning-bg); border-left-color: var(--warning-border); color: var(--warning-text); }
    #content .hint.warning .label { color: #b65c00; }
    #content table { width: 100%; border-collapse: collapse; font-size: 0.92rem; margin: 0.85rem 0 1rem; }
    #content th, #content td {
      border: 1px solid var(--border); padding: 0.65rem 0.75rem;
      text-align: left; vertical-align: top;
    }
    #content th { background: var(--bg-subtle); font-weight: 650; }
    #content code, #content pre { font-family: var(--mono); }
    #content code {
      background: var(--bg-subtle); border: 1px solid var(--border);
      border-radius: 4px; padding: 0.1rem 0.35rem; font-size: 0.88em; color: #1c1c24;
    }
    #content pre {
      background: var(--bg-subtle); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 0.95rem 1.05rem; overflow-x: auto;
      font-size: 0.84rem; line-height: 1.5; color: #1c1c24; margin: 0.85rem 0;
    }
    #content pre code { background: none; border: none; padding: 0; }
    #content .mermaid-wrap {
      background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1rem; overflow-x: auto; margin: 1rem 0; color: #1c1c24;
    }
    #content .mermaid-wrap .mermaid { background: transparent !important; border: none !important; padding: 0 !important; margin: 0 !important; }
    #content .mermaid-wrap svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
    #content .mermaid-wrap .nodeLabel,
    #content .mermaid-wrap .nodeLabel *,
    #content .mermaid-wrap foreignObject,
    #content .mermaid-wrap foreignObject div,
    #content .mermaid-wrap foreignObject span { color: #1c1c24 !important; }
    #content .mermaid-wrap .edgePath path { stroke: #1c1c24 !important; stroke-width: 1.5px !important; }
    #content .mermaid-wrap marker path { fill: #1c1c24 !important; stroke: #1c1c24 !important; }
    #content .task-list-item { list-style: none; margin-left: -1.1rem; }
    #content .task-list-item input[type="checkbox"] {
      appearance: none; -webkit-appearance: none;
      width: 1.1rem; height: 1.1rem; margin: 0 0.55rem 0 0; vertical-align: -0.15rem;
      border: 1.5px solid var(--border-strong); border-radius: 4px; background: #fff; cursor: pointer;
      display: inline-grid; place-items: center;
    }
    #content .task-list-item input[type="checkbox"]:checked {
      background: var(--brand); border-color: var(--brand);
    }
    #content .task-list-item input[type="checkbox"]:checked::after {
      content: ""; width: 0.25rem; height: 0.5rem; border: solid #fff; border-width: 0 2px 2px 0;
      transform: rotate(45deg) translate(-0.5px, -1px);
    }
    #content .task-list-item:has(input:checked) { color: var(--text-muted); text-decoration: line-through; }
    .status-error {
      border: 1px solid #f2c9c9; background: #fff5f5; color: #7a1f1f;
      border-radius: var(--radius); padding: 1rem; margin: 1rem 0;
    }
    .status-error code { background: #ffe8e8; }
    footer {
      margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--border);
      color: var(--text-muted); font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="https://cortex-docs.paloaltonetworks.com/" target="_blank" rel="noopener">
      <span class="brand-mark" aria-hidden="true"></span>
      Cortex Docs
    </a>
    <div class="topbar-meta">Rendered from <code>README.md</code></div>
  </header>

  <main class="page">
    <p class="ssot">
      Single source of truth: <a href="./README.md"><code>README.md</code></a>.
      This page only styles and renders that file.
    </p>
    <article id="content">Loading <code>README.md</code>…</article>
    <footer>Viewer only — edit <code>README.md</code> to change content.</footer>
  </main>

  <script type="module">
    import { marked } from "https://cdn.jsdelivr.net/npm/marked@15.0.7/lib/marked.esm.js";
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

    const MD_URL = new URL("./README.md", window.location.href).href;
    const content = document.getElementById("content");
    const STORAGE_KEY = "byok-checklist-v1";

    function convertGitHubAlerts(md) {
      return md.replace(
        /^>\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*\n((?:>.*(?:\n|$))+)/gim,
        (_, type, body) => {
          const text = body
            .split("\n")
            .map((line) => line.replace(/^>\s?/, ""))
            .join("\n")
            .trim();
          const kind = String(type).toUpperCase();
          const cls = kind === "CAUTION" || kind === "WARNING" ? "warning"
            : kind === "TIP" ? "success"
            : "info";
          const label = kind === "CAUTION" ? "Caution" : kind === "WARNING" ? "Warning"
            : kind === "TIP" ? "Tip" : kind === "IMPORTANT" ? "Important" : "Note";
          return `\n\n<div class="hint ${cls}" markdown="1">\n<div class="label">${label}</div>\n\n${text}\n\n</div>\n\n`;
        }
      );
    }

    // Hide the self-referential HTML companion blurb inside the HTML viewer
    function stripViewerSelfRef(md) {
      return md
        .replace(/^>\s*Styled companion page.*$/gim, "")
        .replace(
          /^\|\s*`?\[`?README\.html`?\][^|]*\|\s*Styled customer guide\s*\|\s*$/gim,
          "| [`README.html`](./README.html) | Viewer that renders this Markdown file |"
        );
    }

    marked.setOptions({ gfm: true, breaks: false });

    // Marked v15+: code renderer receives a token object
    marked.use({
      renderer: {
        code({ text, lang }) {
          const language = (lang || "").trim().split(/\s+/)[0];
          if (language === "mermaid") {
            const escaped = text
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");
            return `<div class="mermaid-wrap"><pre class="mermaid">${escaped}</pre></div>\n`;
          }
          return false; // fall back to default renderer
        }
      }
    });

    async function loadMarkdown() {
      const res = await fetch(MD_URL, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status} loading README.md`);
      return res.text();
    }

    function enhanceTaskLists(root) {
      const boxes = [...root.querySelectorAll(".task-list-item input[type=checkbox], li input[type=checkbox]")];
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch (_) {}
      boxes.forEach((box, i) => {
        const li = box.closest("li");
        if (li) li.classList.add("task-list-item");
        box.disabled = false;
        const key = box.dataset.key || `item-${i}`;
        box.dataset.key = key;
        box.checked = !!saved[key];
        box.addEventListener("change", () => {
          const state = {};
          boxes.forEach((b) => { state[b.dataset.key] = b.checked; });
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        });
      });
    }

    function promoteMermaidFallbacks(root) {
      root.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
        const wrap = document.createElement("div");
        wrap.className = "mermaid-wrap";
        const pre = document.createElement("pre");
        pre.className = "mermaid";
        pre.textContent = code.textContent;
        wrap.appendChild(pre);
        code.parentElement.replaceWith(wrap);
      });
    }

    try {
      let md = await loadMarkdown();
      md = stripViewerSelfRef(md);
      md = convertGitHubAlerts(md);
      content.innerHTML = marked.parse(md);
      promoteMermaidFallbacks(content);

      mermaid.initialize({
        startOnLoad: false,
        theme: "base",
        securityLevel: "loose",
        flowchart: { htmlLabels: true, padding: 16, nodeSpacing: 40, rankSpacing: 48, useMaxWidth: true },
        themeVariables: {
          fontFamily: "Inter, Segoe UI, system-ui, sans-serif",
          fontSize: "14px",
          primaryColor: "#e8faf0",
          primaryTextColor: "#1c1c24",
          primaryBorderColor: "#00a452",
          lineColor: "#1c1c24",
          textColor: "#1c1c24",
          nodeTextColor: "#1c1c24",
          mainBkg: "#ffffff",
          clusterBkg: "#f7f7f8",
          clusterBorder: "#e5e5e6",
          edgeLabelBackground: "#ffffff"
        }
      });
      await mermaid.run({ querySelector: "#content .mermaid" });
      enhanceTaskLists(content);
    } catch (err) {
      content.innerHTML = `
        <div class="status-error">
          <p><strong>Could not load <code>README.md</code></strong> (SSOT).</p>
          <p>${String(err.message || err)}</p>
          <p>Browsers block fetching local files via <code>file://</code>. Serve the folder instead:</p>
          <pre><code>cd tenant-onboarding-byok-xsiam
python3 -m http.server 8765
# open http://localhost:8765/README.html</code></pre>
          <p>Or read the source directly: <a href="./README.md">README.md</a></p>
        </div>`;
    }
  </script>
</body>
</html>
